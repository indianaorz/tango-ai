<!DOCTYPE html>
<html>
<head>
    <title>RL Dataset Inspector</title>
    <style>
        body { background: #0d0d0d; color: #eee; font-family: 'Consolas', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* --- SIDEBAR --- */
        .sidebar { width: 320px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .list-header { padding: 15px; background: #222; border-bottom: 1px solid #333; }
        .list-filters { display: flex; gap: 5px; margin-top: 10px; }
        .filter-btn { flex: 1; background: #333; border: 1px solid #444; color: #888; cursor: pointer; padding: 5px; font-size: 11px; }
        .filter-btn.active { background: #4db8ff; color: #000; border-color: #4db8ff; }
        
        .sample-list { flex: 1; overflow-y: auto; }
        .sample-item { padding: 10px 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .sample-item:hover { background: #2a2a2a; }
        .sample-item.active { background: #2c3e50; border-left: 3px solid #4db8ff; }
        
        .w-badge { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 11px; width: 40px; text-align: center; }
        .w-high { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #005500; }
        .w-low { background: rgba(255, 0, 0, 0.2); color: #ff4444; border: 1px solid #550000; }
        .w-mid { background: #333; color: #aaa; }

        /* --- MAIN STAGE --- */
        .stage { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; align-items: center; }
        
        /* TOP ROW: Image vs Video */
        .visuals-row { display: flex; gap: 20px; width: 100%; max-width: 1200px; height: 360px; }
        .view-box { flex: 1; background: #151515; border: 1px solid #333; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; position: relative; }
        .view-header { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        .model-view { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* WEIGHT DISPLAY */
        .weight-floater { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border: 1px solid #444; text-align: center; z-index: 10; }
        .big-stat { font-size: 32px; font-weight: bold; line-height: 1; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* --- CONTROLLER (From Inspect Cache) --- */
        .controls-area { display: flex; gap: 40px; margin-top: 10px; }
        
        .controller { background: #e0e0e0; width: 240px; height: 140px; border-radius: 15px 15px 30px 30px; position: relative; border: 2px solid #999; transform: scale(1); }
        .btn { position: absolute; background: #555; border: 1px solid #333; transition: background 0.05s; }
        .btn.active { background: #00ff00 !important; box-shadow: 0 0 10px #00ff00; }
        
        .dpad { position: absolute; top: 45px; left: 20px; width: 70px; height: 70px; }
        .btn.up { top: 0; left: 23px; width: 24px; height: 24px; }
        .btn.down { bottom: 0; left: 23px; width: 24px; height: 24px; }
        .btn.left { top: 23px; left: 0; width: 24px; height: 24px; }
        .btn.right { top: 23px; right: 0; width: 24px; height: 24px; }
        
        .btn.a { top: 55px; right: 15px; width: 28px; height: 28px; border-radius: 50%; background: #a00; display: flex; justify-content: center; align-items: center; font-size: 10px; color: rgba(255,255,255,0.5); }
        .btn.b { top: 70px; right: 50px; width: 28px; height: 28px; border-radius: 50%; background: #a00; display: flex; justify-content: center; align-items: center; font-size: 10px; color: rgba(255,255,255,0.5); }
        .btn.l { top: -8px; left: 10px; width: 60px; height: 15px; border-radius: 5px 5px 0 0; background: #ccc; z-index: -1; }
        .btn.r { top: -8px; right: 10px; width: 60px; height: 15px; border-radius: 5px 5px 0 0; background: #ccc; z-index: -1; }
        .btn.start { bottom: 15px; left: 100px; width: 25px; height: 8px; transform: rotate(-25deg); background: #999; }
        .btn.select { bottom: 15px; left: 70px; width: 25px; height: 8px; transform: rotate(-25deg); background: #999; }

        /* --- TIMELINE --- */
        .timeline-wrap { width: 500px; }
        .timeline { display: grid; grid-template-columns: 60px repeat(18, 1fr); gap: 2px; align-items: center; }
        .lane-label { font-size: 10px; color: #aaa; text-align: right; padding-right: 6px; }
        .cell { width: 100%; height: 10px; background: #222; border: 1px solid #333; border-radius: 2px; }
        .cell.active { background: #00ff00; box-shadow: 0 0 4px rgba(0, 255, 0, 0.5); border-color: #00cc00; }
        
        .meta-info { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="list-header">
            <h3 style="margin:0">RL Samples</h3>
            <div style="font-size:11px; color:#666; margin-top:5px;">
                Total: {{ stats.total }} <br>
                <span style="color:#00ff00">High: {{ stats.high_reward }}</span> | 
                <span style="color:#ff4d4d">Low: {{ stats.punishment }}</span>
            </div>
            <div class="list-filters">
                <button class="filter-btn active" onclick="loadList('all', this)">ALL</button>
                <button class="filter-btn" onclick="loadList('high', this)">REWARDS</button>
                <button class="filter-btn" onclick="loadList('low', this)">PUNISH</button>
            </div>
        </div>
        <div class="sample-list" id="sampleList"></div>
    </div>

    <div class="stage">
        
        <div class="visuals-row">
            <div class="view-box">
                <div class="view-header">
                    <span>Model Input (Frame t)</span>
                    <span style="color:#4db8ff" id="srcType">TENSOR</span>
                </div>
                <img id="imgInput" class="model-view" src="" onerror="this.style.display='none'">
                <div id="noImg" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#555;">No Tensor Cache</div>
            </div>

            <div class="view-box">
                <div class="view-header">
                    <span>Context Window (t ... t+90)</span>
                    <span style="color:#aaa">Video</span>
                </div>
                <video id="vidContext" muted></video>
                
                <div class="weight-floater">
                    <div class="stat-label">RL Weight</div>
                    <div id="metaWeight" class="big-stat">--</div>
                </div>
            </div>
        </div>

        <div class="meta-info">
            <span id="metaReplay" style="color:#fff">Select a sample...</span> | Frame: <span id="metaFrame">0</span>
        </div>

        <div class="controls-area">
            
            <div>
                <div class="view-header" style="text-align:center">Action at t=0</div>
                <div class="controller" id="ctrl-truth">
                    <div class="btn l" id="btn-LEFT_SHOULDER"></div>
                    <div class="btn r" id="btn-RIGHT_SHOULDER"></div>
                    <div class="dpad">
                        <div class="btn up" id="btn-DPAD_UP"></div>
                        <div class="btn down" id="btn-DPAD_DOWN"></div>
                        <div class="btn left" id="btn-DPAD_LEFT"></div>
                        <div class="btn right" id="btn-DPAD_RIGHT"></div>
                    </div>
                    <div class="btn a" id="btn-EAST">A</div>
                    <div class="btn b" id="btn-SOUTH">B</div>
                    <div class="btn select" id="btn-BACK"></div>
                    <div class="btn start" id="btn-START"></div>
                </div>
            </div>

            <div class="timeline-wrap">
                <div class="view-header">Ground Truth Sequence (Next 18 Frames)</div>
                <div id="timeline"></div>
            </div>
        </div>

    </div>

    <script>
        const UI_BTNS = ['DPAD_UP', 'DPAD_DOWN', 'DPAD_LEFT', 'DPAD_RIGHT', 'EAST', 'SOUTH', 'LEFT_SHOULDER', 'RIGHT_SHOULDER', 'BACK', 'START'];
        
        // INIT
        loadList('all', document.querySelector('.filter-btn'));

        function niceLabel(k) {
            if (k === 'BACK') return 'SEL';
            if (k === 'EAST') return 'A';
            if (k === 'SOUTH') return 'B';
            if (k.startsWith('DPAD_')) return k.replace('DPAD_', '');
            if (k === 'LEFT_SHOULDER') return 'L';
            if (k === 'RIGHT_SHOULDER') return 'R';
            return k;
        }

        function loadList(filter, btnEl) {
            if(btnEl) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnEl.classList.add('active');
            }
            document.getElementById('sampleList').innerHTML = '<div style="padding:20px; color:#666; text-align:center">Loading...</div>';

            fetch(`/api/rl_list?filter=${filter}`).then(r=>r.json()).then(data => {
                const listEl = document.getElementById('sampleList');
                listEl.innerHTML = '';
                data.forEach((item, idx) => {
                    const el = document.createElement('div');
                    el.className = 'sample-item';
                    const wClass = item.weight > 1.0 ? 'w-high' : (item.weight < 1.0 ? 'w-low' : 'w-mid');
                    el.innerHTML = `
                        <div style="font-size:11px; overflow:hidden;">
                            <div style="color:#fff; white-space:nowrap;">${item.replay}</div>
                            <div style="color:#666;">Frame: ${item.frame}</div>
                        </div>
                        <div class="w-badge ${wClass}">${item.weight}</div>
                    `;
                    el.onclick = () => loadDetail(idx, el, item);
                    listEl.appendChild(el);
                });
            });
        }

        function loadDetail(idx, el, item) {
            // Update UI Active
            document.querySelectorAll('.sample-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            // Update Metadata
            document.getElementById('metaReplay').innerText = item.replay;
            document.getElementById('metaFrame').innerText = item.frame;
            const wEl = document.getElementById('metaWeight');
            wEl.innerText = item.weight.toFixed(2);
            wEl.style.color = item.weight > 1 ? '#00ff00' : (item.weight < 1 ? '#ff4d4d' : '#888');

            // Video Setup (Don't play yet)
            const vid = document.getElementById('vidContext');
            const src = `/video/${item.replay}`;
            if (!vid.currentSrc.includes(src)) vid.src = src;

            // Fetch Data
            fetch(`/api/rl_detail/${idx}`).then(r=>r.json()).then(data => {
                if(data.error) { alert(data.error); return; }

                // 1. Image Handling
                const imgEl = document.getElementById('imgInput');
                const noImg = document.getElementById('noImg');
                document.getElementById('srcType').innerText = data.source_type.toUpperCase();
                
                if (data.image) {
                    imgEl.src = data.image;
                    imgEl.style.display = 'block';
                    noImg.style.display = 'none';
                } else {
                    imgEl.style.display = 'none';
                    noImg.style.display = 'block';
                }

                // 2. Video Looping Logic
                const startT = Math.max(0, data.timestamp);
                const endT = startT + 1.5; // Loop 1.5 seconds
                
                // Clear old listener
                if(vid._loop) vid.removeEventListener('timeupdate', vid._loop);
                
                // Define new loop
                vid._loop = () => {
                    if(vid.currentTime >= endT) {
                        vid.currentTime = startT;
                        vid.play();
                    }
                };
                vid.addEventListener('timeupdate', vid._loop);
                
                // Start
                vid.currentTime = startT;
                vid.play();

                // 3. Controller & Timeline
                if(data.actions && data.actions.length > 0) {
                    // Update Controller (Frame 0)
                    const act0 = data.actions[0].buttons_raw;
                    UI_BTNS.forEach(k => {
                        const btn = document.getElementById(`btn-${k}`);
                        if(btn) {
                            btn.classList.remove('active');
                            if(act0[k] > 0.5) btn.classList.add('active');
                        }
                    });

                    // Update Timeline
                    renderTimeline(data.actions);
                }
            });
        }

        function renderTimeline(actions) {
            const el = document.getElementById('timeline');
            el.innerHTML = '';
            
            // Create Grid
            const T = actions.length;
            const grid = document.createElement('div');
            grid.className = 'timeline';
            grid.style.gridTemplateColumns = `60px repeat(${T}, 1fr)`;

            UI_BTNS.forEach(key => {
                // Label
                const lbl = document.createElement('div');
                lbl.className = 'lane-label';
                lbl.innerText = niceLabel(key);
                grid.appendChild(lbl);

                // Cells
                actions.forEach(act => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = act.buttons_raw[key] || 0;
                    if(val > 0.5) cell.classList.add('active');
                    grid.appendChild(cell);
                });
            });
            el.appendChild(grid);
        }
    </script>
</body>
</html>
