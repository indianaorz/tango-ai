<!DOCTYPE html>
<html>
<head>
    <title>Viewing: {{ replay_name }}</title>
    <style>
        body { background: #111; color: #fff; font-family: 'Consolas', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        h2 { margin-bottom: 10px; color: #ccc; }
        a { color: #888; text-decoration: none; align-self: flex-start; margin-bottom: 20px; font-size: 14px; }
        a:hover { color: #fff; text-decoration: underline; }
        .container { display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; max-width: 1400px; }
        
        /* VIDEO */
        video { border: 2px solid #444; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); background: #000; image-rendering: pixelated; width: 100%; max-width: 720px; }
        
        .sidebar { display: flex; flex-direction: column; gap: 15px; width: 340px; flex-shrink: 0; }
        .extra-sidebar { display: flex; flex-direction: column; gap: 15px; width: 220px; flex-shrink: 0; }

        /* CONTROLLER */
        .controller { background: #e0e0e0; width: 300px; height: 180px; border-radius: 20px 20px 40px 40px; position: relative; border: 2px solid #999; flex-shrink: 0; margin: 0 auto; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.5); }
        .btn { position: absolute; background: #555; border: 1px solid #333; transition: background 0.05s; }
        .btn.active { background: #00ff00 !important; box-shadow: 0 0 10px #00ff00; border-color: #00cc00; }
        .dpad { position: absolute; top: 60px; left: 30px; width: 90px; height: 90px; }
        .dpad .btn { background: #333; }
        .btn.up { top: 0; left: 30px; width: 30px; height: 30px; border-radius: 3px 3px 0 0; }
        .btn.down { bottom: 0; left: 30px; width: 30px; height: 30px; border-radius: 0 0 3px 3px; }
        .btn.left { top: 30px; left: 0; width: 30px; height: 30px; border-radius: 3px 0 0 3px; }
        .btn.right { top: 30px; right: 0; width: 30px; height: 30px; border-radius: 0 3px 3px 0; }
        .dpad-center { position: absolute; top: 30px; left: 30px; width: 30px; height: 30px; background: #333; }
        .btn.a { top: 70px; right: 20px; width: 35px; height: 35px; border-radius: 50%; background: #a00; border: 2px solid #600; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.5); font-weight: bold;}
        .btn.b { top: 90px; right: 65px; width: 35px; height: 35px; border-radius: 50%; background: #a00; border: 2px solid #600; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.5); font-weight: bold;}
        .btn.a.active, .btn.b.active { background: #ff3333 !important; box-shadow: 0 0 15px #ff0000; }
        .btn.start { bottom: 20px; left: 120px; width: 30px; height: 10px; border-radius: 10px; transform: rotate(-25deg); background: #999; }
        .btn.select { bottom: 20px; left: 80px; width: 30px; height: 10px; border-radius: 10px; transform: rotate(-25deg); background: #999; }
        .btn.l { top: -10px; left: 10px; width: 80px; height: 20px; border-radius: 10px 10px 0 0; background: #ccc; z-index: -1; }
        .btn.r { top: -10px; right: 10px; width: 80px; height: 20px; border-radius: 10px 10px 0 0; background: #ccc; z-index: -1; }

        /* PANELS */
        .panel { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; width: 100%; box-sizing: border-box; }
        .panel h4 { margin: 0 0 10px 0; font-size: 11px; color: #888; text-align: center; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 3px; }
        
        /* DATA TABLE STYLE */
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th { text-align: left; color: #666; padding-bottom: 4px; font-weight: normal; border-bottom: 1px solid #333; }
        .data-table td { padding: 4px 0; border-bottom: 1px solid #2a2a2a; }
        .col-p1 { color: #4db8ff; width: 40%; }
        .col-p2 { color: #ff4d4d; width: 40%; text-align: right; }
        .col-lbl { color: #888; width: 20%; text-align: center; font-size: 10px; }

        /* GRID */
        .battle-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; background: #000; padding: 2px; border: 1px solid #555; }
        .grid-cell { height: 25px; background: #333; display: flex; justify-content: center; align-items: center; font-size: 10px; color: #777; position: relative; }
        .cell-p1 { background: rgba(77, 184, 255, 0.3); border: 1px solid #4db8ff; }
        .cell-p2 { background: rgba(255, 77, 77, 0.3); border: 1px solid #ff4d4d; }
        .broken { border: 1px dashed #555 !important; background: #111 !important; }

        /* HAND & QUEUE (UPDATED) */
        .hand-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .queue-list { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }

        .chip-slot { 
            background: #222; border: 1px solid #444; 
            height: 45px; width: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-end; 
            border-radius: 4px; position: relative; overflow: hidden;
            box-sizing: border-box;
        }

        .queue-slot-wrap { width: 35px; height: 45px; } 
        
        .chip-img {
            width: 100%; height: 100%;
            object-fit: contain; 
            position: absolute; top: 0; left: 0; z-index: 0;
        }

        .chip-code { 
            font-size: 9px; color: #fff; font-weight: bold;
            background: rgba(0,0,0,0.7);
            width: 100%; text-align: center;
            padding: 1px 0; z-index: 1; position: relative; 
        }

        .chip-fallback-id { font-size: 10px; font-weight: bold; color: #555; z-index: 1; margin-bottom: 12px; }

        /* FOLDER */
        .folder-list { height: 400px; overflow-y: auto; font-size: 11px; color: #aaa; }
        .folder-item { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #333; }
        
        .meta-row { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 10px; }

        /* TIMELINE */
        .timeline-container { display: grid; grid-template-columns: 50px repeat(18, 1fr); gap: 2px; align-items: center; user-select: none; }
        .tl-label { font-size: 9px; color: #888; text-align: right; padding-right: 5px; text-transform: uppercase; }
        .tl-cell { width: 100%; height: 8px; background: #222; border: 1px solid #333; border-radius: 1px; }
        .tl-cell.active { background: #00ff00; box-shadow: 0 0 5px rgba(0, 255, 0, 0.5); border-color: #00cc00; }
    </style>
</head>
<body>
    <a href="/">&larr; Back to List</a>
    <h2>{{ replay_name }}</h2>
    
    <div class="container">
        <div class="extra-sidebar">
            <div class="panel">
                <h4>Player Folder</h4>
                <div id="p-folder" class="folder-list">Loading...</div>
            </div>
            <div class="panel">
                <h4>Navi Cust</h4>
                <div id="p-navi" style="font-size:10px; color:#aaa; word-wrap:break-word;"></div>
            </div>
        </div>

        <div style="flex-grow: 1; display:flex; flex-direction:column; align-items:center; gap: 10px;">
            <video id="vid" controls><source src="/video/{{ replay_name }}" type="video/mp4"></video>
            
            <div class="panel" style="width: 100%; max-width: 720px;">
                <h4>Input Horizon (18f)</h4>
                <div id="timeline-grid" class="timeline-container"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="controller">
                <div class="btn l" id="btn-L"></div><div class="btn r" id="btn-R"></div>
                <div class="dpad">
                    <div class="dpad-center"></div>
                    <div class="btn up" id="btn-UP"></div><div class="btn down" id="btn-DOWN"></div>
                    <div class="btn left" id="btn-LEFT"></div><div class="btn right" id="btn-RIGHT"></div>
                </div>
                <div class="btn b" id="btn-B">B</div><div class="btn a" id="btn-A">A</div>
                <div class="btn select" id="btn-SELECT"></div><div class="btn start" id="btn-START"></div>
            </div>

            <div class="panel">
                <h4>Game State</h4>
                <div class="meta-row">
                    <span>Frame: <span id="frame" style="color:#fff">0</span></span>
                    <span id="win-state" style="color:#888">[BATTLE]</span>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="col-p1">PLAYER</th>
                            <th class="col-lbl">VS</th>
                            <th class="col-p2">ENEMY</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="col-p1" id="p-hp">---</td>
                            <td class="col-lbl">HP</td>
                            <td class="col-p2" id="e-hp">---</td>
                        </tr>
                        <tr>
                            <td class="col-p1" id="p-chip">--</td>
                            <td class="col-lbl">Chip</td>
                            <td class="col-p2" id="e-chip">--</td>
                        </tr>
                        <tr>
                            <td class="col-p1" id="p-emo">0</td>
                            <td class="col-lbl">Face</td>
                            <td class="col-p2" id="e-emo">0</td>
                        </tr>
                        <tr>
                            <td class="col-p1" id="p-game-emo">0</td>
                            <td class="col-lbl">State</td>
                            <td class="col-p2" id="e-game-emo">0</td>
                        </tr>
                        <tr>
                            <td class="col-p1" id="p-chg">0</td>
                            <td class="col-lbl">Chg</td>
                            <td class="col-p2" id="e-chg">0</td>
                        </tr>
                        <tr>
                            <td class="col-p1" id="p-pos">[0,0]</td>
                            <td class="col-lbl">Pos</td>
                            <td class="col-p2" id="e-pos">[0,0]</td>
                        </tr>
                    </tbody>
                </table>

                <div style="margin-top:10px; font-size:11px; color:#aaa; display:flex; justify-content:space-between;">
                    <span>Gauge: <span id="cust" style="color:#fff">0</span></span>
                    <span>Menu: <span id="menu-idx">0</span></span>
                    <span>Cross: <span id="cross-idx">0</span></span>
                </div>
            </div>

            <div class="panel">
                <h4>Selected Queue</h4>
                <div id="queue" class="queue-list">
                    </div>
            </div>

            <div class="panel">
                <h4>Battle Grid</h4>
                <div id="grid" class="battle-grid"></div>
            </div>

            <div class="panel">
                <h4>Active Hand (RAM)</h4>
                <div id="hand" class="hand-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const vid = document.getElementById('vid');
        let actions = [];
        let CHIP_LIB = {};
        const FPS = 60;
        const KEYS = {'DPAD_UP':'btn-UP', 'DPAD_DOWN':'btn-DOWN', 'DPAD_LEFT':'btn-LEFT', 'DPAD_RIGHT':'btn-RIGHT',
                      'EAST':'btn-A', 'SOUTH':'btn-B', 'LEFT_SHOULDER':'btn-L', 'RIGHT_SHOULDER':'btn-R', 'START':'btn-START', 'BACK':'btn-SELECT'};
        
        const TIMELINE_KEYS = ['DPAD_UP', 'DPAD_DOWN', 'DPAD_LEFT', 'DPAD_RIGHT', 'EAST', 'SOUTH', 'LEFT_SHOULDER', 'RIGHT_SHOULDER', 'BACK', 'START'];
        const TIMELINE_LABELS = {
            'DPAD_UP': 'UP', 'DPAD_DOWN': 'DOWN', 'DPAD_LEFT': 'LEFT', 'DPAD_RIGHT': 'RIGHT',
            'EAST': 'A', 'SOUTH': 'B', 'LEFT_SHOULDER': 'L', 'RIGHT_SHOULDER': 'R', 'BACK': 'SEL', 'START': 'STA'
        };
        const HORIZON = 18;
        const CODE_INDEXES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ*";

        // Init Elements
        for(let i=0; i<18; i++) document.getElementById('grid').innerHTML += `<div class="grid-cell" id="c-${i}"></div>`;
        
        // Init Hand Slots
        const handEl = document.getElementById('hand');
        handEl.innerHTML = '';
        for(let i=0; i<10; i++) {
            handEl.innerHTML += `<div class="chip-slot" id="h-${i}"></div>`;
        }

        // Init Queue Slots
        const queueEl = document.getElementById('queue');
        queueEl.innerHTML = '';
        for(let i=0; i<5; i++) {
            queueEl.innerHTML += `<div class="queue-slot-wrap"><div class="chip-slot" id="q-${i}"></div></div>`;
        }
        
        // Init Timeline
        const tlGrid = document.getElementById('timeline-grid');
        TIMELINE_KEYS.forEach(key => {
            const lbl = document.createElement('div');
            lbl.className = 'tl-label';
            lbl.innerText = TIMELINE_LABELS[key];
            tlGrid.appendChild(lbl);
            for(let t=0; t<HORIZON; t++) {
                const cell = document.createElement('div');
                cell.className = 'tl-cell';
                cell.id = `tl-${key}-${t}`; 
                tlGrid.appendChild(cell);
            }
        });

        // Load Chip Library then Data
        fetch('/api/chip_library').then(r=>r.json()).then(lib => {
            CHIP_LIB = lib;
            // Now load replay data
            return fetch('/inputs/{{ replay_name }}');
        }).then(r=>r.json()).then(data => {
            actions = data.frames || [];
            const staticData = data.static || {};
            renderStatic(staticData);
            requestAnimationFrame(loop);
        });

        function resolveChip(id, rawCode) {
            if (id === 255 || id === undefined) return null;
            const isMid = (rawCode % 2 === 1);
            const codeIdx = Math.floor(rawCode / 2);
            const charCode = CODE_INDEXES[codeIdx] || "?";
            const key = (isMid ? "M" : "S") + id;
            const data = CHIP_LIB[key];
            return { 
                img: data && data.Image ? `/assets/images/${data.Image}` : null,
                name: data ? data.Name : `ID:${id}`,
                code: charCode,
                id: id
            };
        }

        function renderStatic(s) {
            const folderEl = document.getElementById('p-folder');
            if (s && s.player_folder_ids) {
                let html = "";
                s.player_folder_ids.forEach((id, idx) => {
                    const code = s.player_folder_codes ? s.player_folder_codes[idx] : "?";
                    html += `<div class="folder-item"><span>${idx+1}. ID:${id}</span><span>Code:${code}</span></div>`;
                });
                folderEl.innerHTML = html;
            } else { folderEl.innerHTML = "No Static Data"; }
            if(s && s.player_navi_cust) document.getElementById('p-navi').innerText = JSON.stringify(s.player_navi_cust);
        }

        function loop() {
            // Strict sync: recalculate index every frame from video time
            if (actions.length) {
                // Use vid.currentTime (seconds) * 60 to get exact frame
                let idx = Math.floor(vid.currentTime * FPS);
                
                // Clamp and check safety
                if (idx < 0) idx = 0;
                if (idx >= actions.length) idx = actions.length - 1;

                render(actions[idx], idx);
            }
            requestAnimationFrame(loop);
        }

        function renderChipSlot(el, chipInfo, opacity) {
            if (!chipInfo) {
                el.innerHTML = "";
                el.style.opacity = 0.2;
                el.style.border = "1px solid #333";
                return;
            }
            el.style.opacity = opacity;
            el.style.border = "1px solid #555";
            el.title = chipInfo.name;
            
            let html = "";
            if (chipInfo.img) {
                html += `<img src="${chipInfo.img}" class="chip-img">`;
            } else {
                html += `<span class="chip-fallback-id">${chipInfo.id}</span>`;
            }
            html += `<span class="chip-code">${chipInfo.code}</span>`;
            el.innerHTML = html;
        }

        function render(d, idx) {
            document.getElementById('frame').innerText = d.frame_idx;
            
            // Controller
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            for(let k in KEYS) {
                const v = d[k];
                if((Array.isArray(v) ? v[0] : v) > 0.5) document.getElementById(KEYS[k]).classList.add('active');
            }

            // Timeline
            for(let t=0; t<HORIZON; t++) {
                const futureFrame = actions[idx + t];
                TIMELINE_KEYS.forEach(k => {
                    const cell = document.getElementById(`tl-${k}-${t}`);
                    if (!cell) return;
                    let active = false;
                    if (futureFrame) {
                        const val = futureFrame[k];
                        active = (Array.isArray(val) ? val[0] : val) > 0.5;
                    }
                    if (active) cell.classList.add('active');
                    else cell.classList.remove('active');
                });
            }

            // Stats
            document.getElementById('p-hp').innerText = d.player_health || 0;
            document.getElementById('e-hp').innerText = d.enemy_health || 0;
            document.getElementById('p-chip').innerText = d.player_chip || "-";
            document.getElementById('e-chip').innerText = d.enemy_chip || "-";
            document.getElementById('p-emo').innerText = d.player_emotion || 0;
            document.getElementById('e-emo').innerText = d.enemy_emotion || 0;
            document.getElementById('p-game-emo').innerText = d.player_game_emotion || 0;
            document.getElementById('e-game-emo').innerText = d.enemy_game_emotion || 0;
            document.getElementById('p-chg').innerText = d.player_charge || 0;
            document.getElementById('e-chg').innerText = d.enemy_charge || 0;
            if(d.player_pos) document.getElementById('p-pos').innerText = `[${d.player_pos}]`;
            if(d.enemy_pos) document.getElementById('e-pos').innerText = `[${d.enemy_pos}]`;

            // Menu/Counters
            const w = document.getElementById('win-state');
            if(d.inside_window) { w.innerText = "[MENU OPEN]"; w.style.color = "#ffff00"; }
            else { w.innerText = "[BATTLE]"; w.style.color = "#444"; }
            document.getElementById('cust').innerText = d.cust_gauge || 0;
            document.getElementById('menu-idx').innerText = d.selected_menu_index || 0;
            document.getElementById('cross-idx').innerText = d.selected_cross_index || 0;

            // Grid
            if(d.grid_state && d.grid_owner_state) {
                for(let i=0; i<18; i++) {
                    const c = document.getElementById(`c-${i}`);
                    c.className = 'grid-cell';
                    if(d.grid_owner_state[i] === 0) c.classList.add('cell-p1');
                    else if(d.grid_owner_state[i] === 1) c.classList.add('cell-p2');
                    if(d.grid_state[i] === 2) c.classList.add('broken');
                    c.innerText = d.grid_state[i] !== 0 ? d.grid_state[i] : "";
                }
            }

            // Hand (Visual)
            if(d.chip_slots) {
                for(let i=0; i<10; i++) {
                    const el = document.getElementById(`h-${i}`);
                    if (i < d.chip_slots.length) {
                        const id = d.chip_slots[i];
                        const code = d.chip_codes ? d.chip_codes[i] : 0;
                        const chipInfo = resolveChip(id, code);
                        
                        let maxVis = d.chip_visible_count || 5;
                        const opacity = (i >= maxVis) ? 0.3 : 1.0;
                        renderChipSlot(el, chipInfo, opacity);
                    } else {
                        renderChipSlot(el, null, 0.2);
                    }
                }
            }

            // Queue (FIXED: STRICT Check against count)
            if(d.selected_chip_indices) {
                let count = d.chip_select_count || 0;
                
                for(let i=0; i<5; i++) {
                    const el = document.getElementById(`q-${i}`);
                    
                    // ONLY render if i < count
                    if (i < count) {
                        const handIdx = d.selected_chip_indices[i]; // Index into hand 0-9
                        
                        if (handIdx !== 255 && handIdx !== undefined && d.chip_slots && handIdx < d.chip_slots.length) {
                            const id = d.chip_slots[handIdx];
                            const code = d.chip_codes ? d.chip_codes[handIdx] : 0;
                            const chipInfo = resolveChip(id, code);
                            
                            // Queue items always fully visible
                            renderChipSlot(el, chipInfo, 1.0);
                        } else {
                            renderChipSlot(el, null, 0.2);
                        }
                    } else {
                        // Strictly empty
                        renderChipSlot(el, null, 0.2);
                    }
                }
            }
        }
    </script>
</body>
</html>
