<!DOCTYPE html>
<html>
<head>
    <title>Tango Dataset Viewer</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        a { color: #4db8ff; text-decoration: none; font-size: 18px; display: block; margin: 5px 0; }
        a:hover { text-decoration: underline; }
        h1 { border-bottom: 1px solid #444; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Tango Replays</h1>
    <div id="list">
        {% for replay in replays %}
            <a href="/view/{{ replay }}">📁 {{ replay }}</a>
        {% else %}
            <p>No replays found in data/dataset/</p>
        {% endfor %}
    </div>
</body>
</html>
